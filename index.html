<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stockroom">
<title>Stockroom</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #111;
    background: #fff;
    padding: env(safe-area-inset-top) 16px 0;
  }
  main { max-width: 600px; margin: 0 auto; padding-bottom: 32px; }
  main.has-tabs { padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
  h1 { font-size: 28px; margin: 0; }
  h2 { font-size: 22px; margin: 0; }
  button { font: inherit; cursor: pointer; }
  .link { background: none; border: 0; color: #0a6cff; font-size: 17px; font-weight: 600; min-height: 44px; padding: 4px 8px; }
  .back { background: none; border: 0; color: #0a6cff; font-size: 17px; font-weight: 600; min-height: 44px; padding: 4px 8px 4px 0; }
  input[type=text], input[type=search], input[type=number] {
    width: 100%; font-size: 16px; padding: 10px 12px;
    border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #111;
  }
  label, .label { display: block; font-size: 13px; color: #555; margin: 16px 0 6px; }

  /* Stage bar: Import > List > Sold > Packed > Shipped */
  .steps { display: flex; margin: 0 0 16px; }
  .step {
    flex: 1; min-width: 0; border: 0; margin-left: -10px; padding: 9px 0 8px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: #e6e9ee; color: #555; font-size: 12px; font-weight: 600;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%);
  }
  .step:first-child {
    margin-left: 0; border-radius: 8px 0 0 8px;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%);
  }
  .step:last-child {
    border-radius: 0 8px 8px 0;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 12px 50%);
  }
  .step.done { background: #bcd6ff; color: #0a3d8f; }
  .step.on { background: #0a6cff; color: #fff; }
  .step .count { font-size: 17px; font-weight: 700; line-height: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters { margin: 12px 0; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
  .chip {
    border: 1px solid #ccc; border-radius: 16px; background: #fff; color: #333;
    padding: 6px 12px; font-size: 14px; white-space: nowrap;
  }
  .chip.on { background: #0a6cff; border-color: #0a6cff; color: #fff; }
  .row { padding: 12px 0; border-top: 1px solid #ddd; }
  .row-top { display: flex; justify-content: space-between; gap: 12px; }
  .name { font-size: 17px; font-weight: 600; }
  .meta { font-size: 13px; color: #666; margin-top: 2px; }
  .info { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; }
  .info .meta { margin-top: 0; }
  .info .profit { margin-left: auto; }
  .profit { font-size: 17px; font-weight: 700; color: #0a7a3d; white-space: nowrap; }
  .neg { color: #b3261e; }
  .pill { font-size: 12px; font-weight: 600; background: #eef4ff; color: #0757c9; border-radius: 10px; padding: 2px 8px; }
  .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .loc-btn {
    flex: 1; min-width: 0; min-height: 44px; text-align: left; background: none; border: 0; padding: 0;
    color: #0757c9; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .loc-btn.grab { background: #fff6e0; color: #111; border-radius: 8px; padding: 0 10px; font-weight: 400; }
  .move {
    flex: none; background: #eef4ff; color: #0757c9; border: 0; min-height: 44px;
    border-radius: 8px; padding: 6px 14px; font-size: 14px; font-weight: 600;
  }
  .empty { text-align: center; color: #666; padding: 48px 16px; font-size: 15px; }
  .error { color: #c00; font-size: 14px; margin-top: 12px; min-height: 1em; }
  .actions { display: flex; gap: 12px; margin-top: 20px; }
  .primary { background: #0a6cff; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 17px; font-weight: 600; flex: 1; min-height: 48px; }
  .secondary { background: #eee; color: #111; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 17px; min-height: 48px; }

  /* Places */
  .place-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    text-align: left; background: none; border: 0; border-top: 1px solid #ddd; color: #111;
    min-height: 60px; padding: 10px 0;
  }
  .place-name { font-size: 17px; font-weight: 600; }
  .chev { color: #0a6cff; font-size: 24px; line-height: 1; }
  #places-view .meta, #place-view .meta { margin-bottom: 12px; }

  /* Summary */
  .card { background: #f4f6f9; border-radius: 12px; padding: 16px; margin-top: 12px; }
  .card-label { font-size: 13px; color: #555; }
  .card-big { font-size: 44px; font-weight: 700; line-height: 1.15; margin-top: 4px; }
  .card-mid { font-size: 36px; font-weight: 700; line-height: 1.15; margin-top: 4px; }
  .good { color: #0a7a3d; }
  .section-label { font-size: 13px; color: #555; margin: 24px 0 6px; }
  .plat-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 60px; border-top: 1px solid #ddd; padding: 8px 0;
  }
  .plat-name { font-size: 17px; font-weight: 600; }
  .plat-profit { font-size: 17px; font-weight: 700; }

  /* Bottom sheets (location, sale) */
  .sheet-wrap {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: flex-end; background: rgba(17, 17, 17, 0.45);
  }
  .sheet {
    width: 100%; max-width: 600px; margin: 0 auto; background: #fff; max-height: 100%; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .profit-box {
    display: flex; align-items: baseline; justify-content: space-between; margin-top: 18px;
    padding: 14px 16px; background: #f0f8f3; border-radius: 10px; font-size: 15px;
  }
  .profit-box strong { font-size: 28px; }

  /* Bottom tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex;
    background: #fff; border-top: 1px solid #ddd; padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; background: none; border: 0; color: #555; font-size: 12px; font-weight: 600;
  }
  .tab.on { color: #0a6cff; }
</style>
</head>
<body>

<main id="list-view" class="has-tabs">
  <header>
    <h1>Stockroom</h1>
    <button class="link" id="add-btn" type="button">+ Add</button>
  </header>
  <nav class="steps" id="steps" aria-label="Stages"></nav>
  <input type="search" id="search" placeholder="Search this stage" autocomplete="off">
  <div class="chips filters" id="filters"></div>
  <div id="list"></div>
</main>

<main id="add-view" hidden>
  <header>
    <h1 id="add-title">Add item</h1>
  </header>
  <form id="add-form" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="e.g. Levi's 501 jeans" autocomplete="off">

    <label for="cost">Cost (what you paid)</label>
    <input type="number" id="cost" placeholder="0.00" inputmode="decimal" step="0.01" min="0">

    <label for="loc">Location (optional)</label>
    <input type="text" id="loc" list="locations" placeholder="e.g. Closet, Tub 3" autocomplete="off">

    <div class="label">Listed on (optional)</div>
    <div class="chips" id="platform-chips"></div>

    <div id="add-sold" hidden>
      <label for="add-price">Sold for $</label>
      <input type="number" id="add-price" placeholder="0.00" inputmode="decimal" step="0.01" min="0">
      <div class="label">Sold on</div>
      <div class="chips" id="add-sold-chips"></div>
    </div>

    <div class="error" id="error" role="alert"></div>
    <div class="actions">
      <button type="button" class="secondary" id="cancel-btn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</main>

<main id="places-view" class="has-tabs" hidden>
  <header>
    <h1>Places</h1>
  </header>
  <div class="meta">Items that have shipped are not counted.</div>
  <div id="places-list"></div>
</main>

<main id="place-view" class="has-tabs" hidden>
  <header>
    <button class="back" id="place-back" type="button">&lsaquo; Places</button>
  </header>
  <h1 id="place-title"></h1>
  <div class="meta" id="place-sub"></div>
  <div id="place-items"></div>
</main>

<main id="summary-view" class="has-tabs" hidden>
  <header>
    <h1>Summary</h1>
  </header>
  <div id="summary"></div>
</main>

<nav class="tabbar" id="tabbar" aria-label="Main">
  <button class="tab" id="tab-stock" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"></path><path d="M3 12l9 4 9-4"></path><path d="M3 17l9 4 9-4"></path></svg>
    <span>Inventory</span>
  </button>
  <button class="tab" id="tab-places" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
    <span>Places</span>
  </button>
  <button class="tab" id="tab-summary" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10"></path><path d="M12 20V4"></path><path d="M19 20v-7"></path></svg>
    <span>Summary</span>
  </button>
</nav>

<datalist id="locations"></datalist>

<div class="sheet-wrap" id="loc-sheet" hidden>
  <form class="sheet" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <h2 id="sheet-title">Where is it?</h2>
    <div class="meta" id="sheet-item"></div>
    <label for="sheet-loc">Location (leave empty for none)</label>
    <input type="text" id="sheet-loc" list="locations" placeholder="e.g. Closet, Tub 3" autocomplete="off">
    <div class="actions">
      <button type="button" class="secondary" id="sheet-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</div>

<div class="sheet-wrap" id="sold-sheet" hidden>
  <form class="sheet" id="sold-form" role="dialog" aria-modal="true" aria-labelledby="sold-title" novalidate>
    <h2 id="sold-title">Mark as sold</h2>
    <div class="name" id="sold-item" style="margin-top: 12px"></div>
    <div class="meta" id="sold-paid"></div>
    <label for="sold-price">Sold for $</label>
    <input type="number" id="sold-price" placeholder="0.00" inputmode="decimal" step="0.01" min="0">
    <div class="label">Sold on</div>
    <div class="chips" id="sold-chips"></div>
    <div class="profit-box">
      <span>Profit</span>
      <strong id="sold-profit">&mdash;</strong>
    </div>
    <div class="error" id="sold-error" role="alert"></div>
    <div class="actions">
      <button type="button" class="secondary" id="sold-cancel">Cancel</button>
      <button type="submit" class="primary">Mark as sold</button>
    </div>
  </form>
</div>

<script>
(function () {
  var STAGES = [
    { id: 'import', label: 'Not listed' },
    { id: 'list', label: 'List' },
    { id: 'sold', label: 'Sold' },
    { id: 'packed', label: 'Packed' },
    { id: 'shipped', label: 'Shipped' }
  ];
  var SOLD_AT = 2; // index of the Sold step: this step and later have a sale price
  // The bar at the top: "All" shows every item, each other step shows the items in that step.
  var BAR = [{ id: 'all', label: 'All' }].concat(STAGES.slice(1));
  var PLATFORMS = ['eBay', 'Poshmark', 'Mercari', 'Depop', 'Vinted', 'Facebook Marketplace', 'Etsy', 'Other'];
  var VIEWS = ['list-view', 'add-view', 'places-view', 'place-view', 'summary-view'];
  var KEY = 'stockroom.items.v1';

  var items = load();
  var stage = 'all';       // which bar step is open
  var query = '';
  var filter = null;
  var selected = [];       // "listed on" apps in the add form
  var addSoldOn = null;    // "sold on" app in the add form
  var editing = null;      // item whose location is being changed
  var selling = null;      // item being marked as sold
  var soldOn = null;       // "sold on" app in the sale sheet

  function $(id) { return document.getElementById(id); }

  function stageIndex(id) {
    for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === id) return i;
    return -1;
  }

  function barIndex(id) {
    for (var i = 0; i < BAR.length; i++) if (BAR[i].id === id) return i;
    return 0;
  }

  function load() {
    var list;
    try {
      var raw = localStorage.getItem(KEY);
      list = raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
    if (!Array.isArray(list)) return [];
    // Accept every older save format and fill in anything missing.
    return list.map(function (i) {
      if (stageIndex(i.stage) === -1) {
        if (i.shipped || i.status === 'shipped') i.stage = 'shipped';
        else if (i.sold || i.status === 'sold') i.stage = 'sold';
        else if (i.price != null || i.status === 'listed') i.stage = 'list';
        else i.stage = 'import';
      }
      var c = Number(i.cost);
      i.cost = (i.cost === null || i.cost === undefined || i.cost === '' || !isFinite(c)) ? null : c;
      if (typeof i.name !== 'string' || !i.name) i.name = 'Untitled item';
      if (!Array.isArray(i.platforms)) i.platforms = [];
      if (typeof i.location !== 'string') i.location = '';
      if (!i.sold || typeof i.sold !== 'object' || !isFinite(Number(i.sold.price))) delete i.sold;
      return i;
    });
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
      return true;
    } catch (e) {
      return false;
    }
  }

  function money(n) { return '$' + Number(n).toFixed(2); }
  function costText(i) { return i.cost === null ? 'No cost yet' : money(i.cost); }
  function countText(n) { return n + (n === 1 ? ' item' : ' items'); }
  function profitText(n) {
    var r = Math.round(n * 100) / 100;
    return (r < 0 ? '-' : '') + '$' + Math.abs(r).toFixed(2);
  }
  function parseMoney(text) {
    var t = String(text).trim();
    var n = Number(t);
    return (t === '' || !isFinite(n) || n < 0) ? null : n;
  }

  // Sale price minus cost, fees and shipping (fees and shipping are 0 until they are added).
  // Returns null when the sale price or the cost is not known.
  function profitOf(i) {
    if (!i.sold || i.cost === null) return null;
    return Number(i.sold.price) - i.cost - Number(i.sold.fees || 0) - Number(i.sold.shipping || 0);
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function button(className, text, onClick) {
    var b = el('button', className, text);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  }

  function chip(label, on, onClick) {
    return button('chip' + (on ? ' on' : ''), label, onClick);
  }

  // A row of chips where exactly one can be picked.
  function renderPickChips(box, options, current, onPick) {
    box.replaceChildren();
    options.forEach(function (p) {
      box.appendChild(chip(p, current === p, function () {
        onPick(p);
        renderPickChips(box, options, p, onPick);
      }));
    });
  }

  function byName(a, b) {
    var x = a.toLowerCase(), y = b.toLowerCase();
    return x < y ? -1 : x > y ? 1 : 0;
  }

  // ---------- views and tabs ----------

  function showView(id) {
    VIEWS.forEach(function (v) { $(v).hidden = (v !== id); });
    $('tabbar').hidden = (id === 'add-view');
    var active = (id === 'places-view' || id === 'place-view') ? 'places' : id === 'summary-view' ? 'summary' : 'stock';
    ['stock', 'places', 'summary'].forEach(function (t) {
      var b = $('tab-' + t);
      b.classList.toggle('on', t === active);
      if (t === active) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }

  // ---------- locations ----------

  // Every place name used so far, one spelling per name.
  function allLocations() {
    var m = new Map();
    items.forEach(function (i) {
      if (i.location && !m.has(i.location.toLowerCase())) m.set(i.location.toLowerCase(), i.location);
    });
    return Array.from(m.values()).sort(byName);
  }

  // "closet " and "Closet" are the same place; keep the spelling already in use.
  function canonLocation(text) {
    var t = String(text).trim().replace(/\s+/g, ' ');
    if (!t) return '';
    var found = allLocations().filter(function (l) { return l.toLowerCase() === t.toLowerCase(); });
    return found.length ? found[0] : t;
  }

  function fillLocationOptions() {
    var dl = $('locations');
    dl.replaceChildren();
    allLocations().forEach(function (l) {
      var o = document.createElement('option');
      o.value = l;
      dl.appendChild(o);
    });
  }

  function openSheet(item) {
    editing = item;
    $('sheet-item').textContent = item.name;
    $('sheet-loc').value = item.location || '';
    fillLocationOptions();
    $('loc-sheet').hidden = false;
    $('sheet-loc').focus();
  }

  function closeSheet() {
    editing = null;
    $('loc-sheet').hidden = true;
  }

  function saveSheet(e) {
    e.preventDefault();
    if (!editing) return;
    var before = editing.location;
    editing.location = canonLocation($('sheet-loc').value);
    if (!save()) {
      editing.location = before;
      alert('Could not save on this device. Is private browsing on?');
      return;
    }
    closeSheet();
    render();
  }

  // ---------- sale sheet ----------

  function updateSoldProfit() {
    var out = $('sold-profit');
    var price = parseMoney($('sold-price').value);
    out.className = '';
    if (price === null || !selling) { out.textContent = '—'; return; }
    if (selling.cost === null) { out.textContent = 'No cost saved'; return; }
    var p = price - selling.cost;
    out.className = p < 0 ? 'neg' : 'good';
    out.textContent = profitText(p);
  }

  function openSoldSheet(item) {
    selling = item;
    soldOn = item.platforms.length === 1 ? item.platforms[0] : null;
    $('sold-item').textContent = item.name;
    $('sold-paid').textContent = item.cost === null ? 'No cost saved for this item' : 'You paid ' + money(item.cost);
    $('sold-price').value = '';
    $('sold-error').textContent = '';
    renderPickChips($('sold-chips'), item.platforms.length ? item.platforms : PLATFORMS, soldOn, function (p) { soldOn = p; });
    updateSoldProfit();
    $('sold-sheet').hidden = false;
    $('sold-price').focus();
  }

  function closeSoldSheet() {
    selling = null;
    $('sold-sheet').hidden = true;
  }

  function confirmSold(e) {
    e.preventDefault();
    if (!selling) return;
    var price = parseMoney($('sold-price').value);
    var err = $('sold-error');
    if (price === null) { err.textContent = 'Enter what it sold for, e.g. 40.00.'; return; }
    if (!soldOn) { err.textContent = 'Pick the app it sold on.'; return; }
    var before = { stage: selling.stage, sold: selling.sold };
    selling.sold = { price: price, platform: soldOn, fees: 0, shipping: 0, date: Date.now() };
    selling.stage = 'sold';
    if (!save()) {
      selling.stage = before.stage;
      if (before.sold) selling.sold = before.sold; else delete selling.sold;
      err.textContent = 'Could not save on this device. Is private browsing on?';
      return;
    }
    closeSoldSheet();
    render();
  }

  // ---------- stage list ----------

  function renderSteps() {
    var box = $('steps');
    box.replaceChildren();
    var current = barIndex(stage);
    BAR.forEach(function (s, idx) {
      var count = s.id === 'all' ? items.length : items.filter(function (i) { return i.stage === s.id; }).length;
      var cls = 'step' + (idx === current ? ' on' : idx < current ? ' done' : '');
      var b = el('button', cls);
      b.type = 'button';
      b.appendChild(el('span', 'count', String(count)));
      b.appendChild(el('span', '', s.label));
      if (idx === current) b.setAttribute('aria-current', 'step');
      b.addEventListener('click', function () {
        stage = s.id;
        render();
      });
      box.appendChild(b);
    });
  }

  function renderFilters() {
    var box = $('filters');
    box.replaceChildren();
    [null].concat(PLATFORMS).forEach(function (p) {
      box.appendChild(chip(p === null ? 'All apps' : p, filter === p, function () {
        filter = p;
        renderFilters();
        renderList();
      }));
    });
  }

  function moveForward(item) {
    var next = STAGES[stageIndex(item.stage) + 1];
    if (!next) return;
    if (next.id === 'sold') { openSoldSheet(item); return; }
    var before = item.stage;
    item.stage = next.id;
    if (!save()) {
      item.stage = before;
      alert('Could not save on this device. Is private browsing on?');
      return;
    }
    render();
  }

  // One tappable line for "where is it": "Grab from: Closet" on sold items, "In Closet" otherwise.
  function locationButton(i) {
    var grab = i.stage === 'sold';
    var b = el('button', 'loc-btn' + (grab ? ' grab' : ''));
    b.type = 'button';
    if (grab) {
      b.appendChild(document.createTextNode('Grab from: '));
      b.appendChild(el('strong', '', i.location || 'not set'));
    } else {
      b.textContent = i.location ? 'In ' + i.location : 'Set location';
    }
    b.addEventListener('click', function () { openSheet(i); });
    return b;
  }

  function renderList() {
    var q = query.trim().toLowerCase();
    var inView = stage === 'all' ? items : items.filter(function (i) { return i.stage === stage; });
    var visible = inView.filter(function (i) {
      return (!q || i.name.toLowerCase().indexOf(q) !== -1) &&
        (!filter || i.platforms.indexOf(filter) !== -1);
    });
    var box = $('list');
    box.replaceChildren();
    if (visible.length === 0) {
      box.appendChild(el('div', 'empty',
        inView.length > 0 ? 'No items match your search or filter.'
          : stage === 'all' ? 'No items yet. Tap + Add to put your first one here.'
          : 'Nothing in ' + BAR[barIndex(stage)].label + ' yet. Tap + Add to put an item here.'));
      return;
    }
    visible.forEach(function (i) {
      var row = el('div', 'row');
      var top = el('div', 'row-top');
      top.appendChild(el('div', 'name', i.name));
      top.appendChild(el('div', '', i.sold ? money(i.sold.price) : costText(i)));
      row.appendChild(top);

      var info = el('div', 'info');
      if (stage === 'all') info.appendChild(el('span', 'pill', STAGES[stageIndex(i.stage)].label));
      if (i.sold) {
        info.appendChild(el('span', 'meta',
          (i.cost === null ? 'No cost saved' : 'Paid ' + money(i.cost)) + ' \u00b7 sold on ' + (i.sold.platform || 'an unknown app')));
        var p = profitOf(i);
        if (p !== null) info.appendChild(el('span', 'profit' + (p < 0 ? ' neg' : ''), 'Profit ' + profitText(p)));
      } else if (i.platforms.length) {
        info.appendChild(el('span', 'meta', i.platforms.join(', ')));
      } else if (i.stage !== 'import') {
        info.appendChild(el('span', 'meta', 'No app yet'));
      }
      row.appendChild(info);

      var next = STAGES[stageIndex(i.stage) + 1];
      var here = i.stage !== 'shipped'; // shipped items have left, so no location
      if (here || next) {
        var actions = el('div', 'card-actions');
        actions.appendChild(here ? locationButton(i) : el('span'));
        if (next) actions.appendChild(button('move', 'Move to ' + next.label + ' \u2192', function () { moveForward(i); }));
        row.appendChild(actions);
      }
      box.appendChild(row);
    });
  }

  function render() {
    renderSteps();
    renderList();
  }

  function showList() {
    showView('list-view');
    render();
  }

  // ---------- places ----------

  // Items still physically here (everything except Shipped), grouped by place.
  function groupByPlace() {
    var map = new Map();
    var none = [];
    items.forEach(function (i) {
      if (i.stage === 'shipped') return;
      if (!i.location) { none.push(i); return; }
      if (!map.has(i.location)) map.set(i.location, []);
      map.get(i.location).push(i);
    });
    return { names: Array.from(map.keys()).sort(byName), map: map, none: none };
  }

  function placeRow(name, count, onClick) {
    var b = el('button', 'place-row');
    b.type = 'button';
    var left = el('span');
    left.appendChild(el('div', 'place-name', name));
    left.appendChild(el('div', 'meta', countText(count)));
    b.appendChild(left);
    b.appendChild(el('span', 'chev', '›'));
    b.addEventListener('click', onClick);
    return b;
  }

  function renderPlaces() {
    var g = groupByPlace();
    var box = $('places-list');
    box.replaceChildren();
    if (g.names.length === 0 && g.none.length === 0) {
      box.appendChild(el('div', 'empty', 'Nothing is stored anywhere yet. Add a location when you add an item.'));
      return;
    }
    g.names.forEach(function (n) {
      box.appendChild(placeRow(n, g.map.get(n).length, function () { showPlace(n); }));
    });
    if (g.none.length) {
      box.appendChild(placeRow('No location', g.none.length, function () { showPlace(''); }));
    }
  }

  function showPlaces() {
    renderPlaces();
    showView('places-view');
  }

  function showPlace(name) {
    var g = groupByPlace();
    var here = name === '' ? g.none : (g.map.get(name) || []);
    $('place-title').textContent = name === '' ? 'No location' : name;
    $('place-sub').textContent = countText(here.length);
    var box = $('place-items');
    box.replaceChildren();
    if (here.length === 0) {
      box.appendChild(el('div', 'empty', 'Nothing here right now.'));
    }
    here.forEach(function (i) {
      var row = el('div', 'row');
      var top = el('div', 'row-top');
      top.appendChild(el('div', 'name', i.name));
      top.appendChild(el('div', '', costText(i)));
      row.appendChild(top);
      row.appendChild(el('div', 'meta',
        STAGES[stageIndex(i.stage)].label + (i.platforms.length ? ' · ' + i.platforms.join(', ') : '')));
      box.appendChild(row);
    });
    showView('place-view');
  }

  // ---------- summary ----------

  function summaryCard(label, bigClass, value, sub) {
    var c = el('div', 'card');
    c.appendChild(el('div', 'card-label', label));
    c.appendChild(el('div', bigClass, value));
    c.appendChild(el('div', 'meta', sub));
    return c;
  }

  function renderSummary() {
    var total = 0, counted = 0, skipped = 0;
    var byApp = new Map();
    items.forEach(function (i) {
      if (stageIndex(i.stage) < SOLD_AT) return;
      var p = profitOf(i);
      if (p === null) { skipped++; return; }
      total += p;
      counted++;
      var app = i.sold.platform || 'Unknown app';
      var e = byApp.get(app) || { n: 0, profit: 0 };
      e.n++;
      e.profit += p;
      byApp.set(app, e);
    });
    var tied = 0, tiedN = 0;
    items.forEach(function (i) {
      if ((i.stage === 'import' || i.stage === 'list') && i.cost !== null) { tied += i.cost; tiedN++; }
    });

    var box = $('summary');
    box.replaceChildren();
    box.appendChild(summaryCard('Total profit', 'card-big ' + (total < 0 ? 'neg' : 'good'),
      profitText(total), 'From ' + countText(counted) + ' sold'));
    box.appendChild(summaryCard('Money tied up in unsold items', 'card-mid', money(tied),
      countText(tiedN) + ' not sold yet'));

    box.appendChild(el('div', 'section-label', 'Profit by app'));
    var apps = Array.from(byApp.keys()).sort(function (a, b) { return byApp.get(b).profit - byApp.get(a).profit; });
    if (apps.length === 0) {
      box.appendChild(el('div', 'empty', 'No sales yet. Move an item to Sold to see profit for each app.'));
    }
    apps.forEach(function (app) {
      var e = byApp.get(app);
      var row = el('div', 'plat-row');
      var left = el('div');
      left.appendChild(el('div', 'plat-name', app));
      left.appendChild(el('div', 'meta', e.n + ' sold'));
      row.appendChild(left);
      row.appendChild(el('div', 'plat-profit ' + (e.profit < 0 ? 'neg' : 'good'), profitText(e.profit)));
      box.appendChild(row);
    });
    if (skipped) {
      box.appendChild(el('div', 'meta', countText(skipped) + ' sold but not counted: the sale price or the cost is missing.'));
    }
  }

  function showSummary() {
    renderSummary();
    showView('summary-view');
  }

  // ---------- add item ----------

  function renderPlatformChips() {
    var box = $('platform-chips');
    box.replaceChildren();
    PLATFORMS.forEach(function (p) {
      var on = selected.indexOf(p) !== -1;
      box.appendChild(chip(p, on, function () {
        selected = on ? selected.filter(function (x) { return x !== p; }) : selected.concat(p);
        renderPlatformChips();
      }));
    });
  }

  // New items start as "not listed" when added from All, otherwise in the open step.
  function addStage() { return stage === 'all' ? 'import' : stage; }

  function showAdd() {
    var alreadySold = addStage() !== 'import' && stageIndex(addStage()) >= SOLD_AT;
    $('add-title').textContent = stage === 'all' ? 'Add item' : 'Add to ' + BAR[barIndex(stage)].label;
    $('name').value = '';
    $('cost').value = '';
    $('loc').value = '';
    $('add-price').value = '';
    $('error').textContent = '';
    selected = [];
    addSoldOn = null;
    $('add-sold').hidden = !alreadySold;
    if (alreadySold) renderPickChips($('add-sold-chips'), PLATFORMS, null, function (p) { addSoldOn = p; });
    fillLocationOptions();
    renderPlatformChips();
    showView('add-view');
    $('name').focus();
  }

  function submit(e) {
    e.preventDefault();
    var name = $('name').value.trim();
    var costText = $('cost').value.trim();
    var cost = Number(costText);
    var alreadySold = stageIndex(addStage()) >= SOLD_AT;
    var price = parseMoney($('add-price').value);
    var err = $('error');

    if (!name) { err.textContent = 'Enter what the item is.'; return; }
    if (costText === '' || !isFinite(cost) || cost < 0) {
      err.textContent = 'Enter what you paid, e.g. 12.50 (0 if it was free).';
      return;
    }
    if (alreadySold && price === null) { err.textContent = 'Enter what it sold for, e.g. 40.00.'; return; }
    if (alreadySold && !addSoldOn) { err.textContent = 'Pick the app it sold on.'; return; }

    var item = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      name: name,
      cost: cost,
      platforms: selected.slice(),
      location: canonLocation($('loc').value),
      stage: addStage(),
      createdAt: Date.now()
    };
    if (alreadySold) item.sold = { price: price, platform: addSoldOn, fees: 0, shipping: 0, date: Date.now() };
    items.unshift(item);
    if (!save()) {
      items.shift();
      err.textContent = 'Could not save on this device. Is private browsing on?';
      return;
    }
    showList();
  }

  $('add-btn').addEventListener('click', showAdd);
  $('tab-stock').addEventListener('click', showList);
  $('tab-places').addEventListener('click', showPlaces);
  $('tab-summary').addEventListener('click', showSummary);
  $('place-back').addEventListener('click', showPlaces);
  $('cancel-btn').addEventListener('click', showList);
  $('add-form').addEventListener('submit', submit);
  $('sheet-form').addEventListener('submit', saveSheet);
  $('sheet-cancel').addEventListener('click', closeSheet);
  $('sold-form').addEventListener('submit', confirmSold);
  $('sold-cancel').addEventListener('click', closeSoldSheet);
  $('sold-price').addEventListener('input', updateSoldProfit);
  $('search').addEventListener('input', function (e) {
    query = e.target.value;
    renderList();
  });

  renderFilters();
  showList();
})();
</script>
</body>
</html>
